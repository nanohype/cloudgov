# The repository settings every nanohype repo is measured against.
#
# These live only in GitHub, so no gate inside a repo can see them. A repo can
# carry a full CI matrix, a protection rule that requires none of it, and nothing
# anywhere will say so — which is the state landing-zone was in while every merge
# to it became live AWS infrastructure.
#
#   cloudgov repo audit --org nanohype
#
# Reported, never enforced. cloudgov reads; changing a setting is a deliberate
# human act.

enforceAdmins: true
allowForcePushes: false
allowDeletions: false
alertsEnabled: true
securityUpdatesEnabled: true

# Per-repo required checks. A repo absent from this map is still measured on
# everything else — an omission must never read as an exemption.
#
# Every name below is a job with NO `paths:` filter on its workflow. That is
# load-bearing: a path-filtered job does not run on a PR that touches nothing it
# watches, so requiring it wedges that PR forever — and with enforceAdmins on
# there is no override left to dig out with. nanohype has 11 of 12 jobs
# path-filtered, which is why it requires none of them here.
requiredChecks:
  eks-gitops:
    - lint
    - Helm-render addons
    - ApplicationSet schema + sync waves
    - Kyverno policy tests
    - Dashboard gate
    - Fork-safety gate
  eks-agent-platform:
    - format check
    - go test (envtest)
    - golangci-lint
    - helm lint + template
    - every image the chart names is published
  landing-zone:
    - Format Check
    - Validate
    - tflint
  fab:
    - lint
    - typecheck
    - test

# An entry here is a decision. A repo silently missing from the sweep is an
# accident that reads identically, which is why absence is not an exemption.
exempt:
  .github: >-
    Org profile and shared workflow templates. No delivery path and no CI to
    require.
  homebrew-tap: >-
    A formula tap whose contents are generated by the release workflow of the
    repo being tapped. Protecting it would block that automation.
