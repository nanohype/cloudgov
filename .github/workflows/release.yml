name: release

on:
  push:
    tags:
      - 'v*'

# Never cancelled. A release that is half-published — archives uploaded, the tap
# formula not yet written — is worse than one that runs twice, so a second tag
# queues behind the first rather than replacing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# No job inherits a write. A workflow-level grant is invisible in the diff that
# adds the next job: that job silently gains whatever was declared here, and
# nothing in the change reads as a permission change. The one job that publishes
# asks for the write itself, so adding a second job grants it nothing.
permissions:
  contents: read

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    # goreleaser creates the GitHub release and uploads the archives to it.
    # contents: write is the grant that upload needs and the only one this job
    # has; nothing here reads or writes packages, pull requests or issues.
    permissions:
      contents: write # create the release and upload its archives
    # The tokens below are scoped to this environment rather than to the
    # repository, so a workflow added on any other path cannot read them even
    # with the same permissions block.
    environment: release
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # goreleaser reads the tag history to build the changelog.
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Off on the publishing path. A cache entry is writable from any branch
          # that ran this workflow's key, so restoring one here would let a
          # branch build influence the artifact a tag publishes.
          cache: false

      - name: run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Pinned so a tag builds with the releaser the commit was tested
          # against.
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
