name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: test with per-package coverage floors
        # Runs the suite with coverage and enforces .coverage-floors (each package
        # has its own floor, ratcheting up as coverage lands). Produces coverage.out.
        run: bash scripts/coverage.sh

      - name: go vet
        run: go vet ./...

      - name: context-awareness check
        # Every cobra handler must thread cmd.Context() (rooted in a SIGINT/SIGTERM
        # context) instead of context.Background(), so an interrupt cancels in-flight
        # cloud calls. Fails on any context.Background() in cmd/ outside Execute().
        run: bash scripts/check-context.sh

      - name: release-URL check
        # .goreleaser.yaml decides the asset filenames; the README repeats them
        # from memory. Nothing compared the two, so every documented install
        # command 404'd — in the README and in the three CI recipes it hands
        # people to paste. This is that comparison, offline against the
        # committed config.
        run: bash scripts/check-release-urls.sh

      - name: upload coverage artifact
        if: always() # keep the profile even when a floor fails, for debugging
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v2 binary requires action v7. v2.12.x is built with Go 1.26,
          # so it type-checks this module's go 1.26 dependencies cleanly.
          version: v2.12.2

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    needs:
      [
        build-and-test,
        lint,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
