name: security

on:
  # Restricted to main, as every other repo in the org is. With '**' a feature
  # branch push and its pull request both run this workflow, so two check runs
  # of the same name report to one commit — and the merge gate is skipped on the
  # push one, which GitHub scores as Success. A required check whose value
  # depends on which run reported last is not a gate.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Tuesday 06:00 UTC — catches newly published CVEs even when no PRs land.
    - cron: '0 6 * * 2'

# Read-only at the workflow level. Only the job that uploads a SARIF report
# needs security-events: write, and granting it here would hand it to every job
# including the ones that run third-party scanners.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate what the commit controls; schedule what the world controls.
  #
  # gosec and zizmor read this tree: their verdict is a function of the commit
  # under test, so they block a merge. govulncheck's is not — a PR that changes
  # nothing goes red the morning an advisory is published against a dependency it
  # did not introduce. Blocking a merge on the world changing is how a gate
  # teaches people to bypass it, so this one runs on every PR for the signal and
  # on the weekly schedule as the thing that has to stay green, and it is not a
  # merge-gate dependency.
  #
  # A scheduled run here can therefore be red with no commit at fault.
  govulncheck:
    name: govulncheck (known-vuln reachability — advisory on PRs, gating on schedule)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        # Hard gate: exits non-zero when any known vulnerability is reachable
        # from this module's code (symbol-level analysis, not just go.sum).
        # Pinned so the verdict is a function of the commit under test rather
        # than of whatever was published when the job ran; Renovate tracks the
        # pin through the govulncheck customManager in renovate.json. The
        # vulnerability database is fetched at run time and stays current.
        run: |
          # renovate: datasource=go depName=golang.org/x/vuln
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  gosec:
    name: gosec (static security analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gosec
        # Hard gate: gosec exits non-zero on any finding at medium+ severity.
        # G304 (file inclusion via variable) is excluded wholesale: every hit
        # is an operator-supplied CLI path (--from report files, the drift
        # tfstate argument, benchmark/standard files) — reading files the operator
        # names is this CLI's contract, not taint. Everything else either got
        # fixed (G301/G306 permissions) or carries an inline, justified
        # `#nosec` at the site (G101 finding-type labels, G204 fixed per-OS
        # report opener).
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: -severity medium -exclude=G304 -fmt sarif -out gosec.sarif ./...

      - name: upload sarif
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.32.2
        with:
          sarif_file: gosec.sarif
          category: gosec

  zizmor:
    name: zizmor (workflow supply-chain analysis)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        # Hard gate over this repo's own workflows, which are a dependency
        # surface the Go module manifest does not describe: every third-party
        # action runs with access to the job token and the workspace.
        #
        # --offline is what makes the verdict a function of the commit under
        # test. Without it zizmor resolves action metadata over the network, so
        # the same commit can pass today and fail tomorrow for reasons no diff
        # explains, and a network failure becomes a build failure.
        run: |
          # renovate: datasource=pypi depName=zizmor
          pipx install zizmor==1.16.3
          zizmor --offline --persona=regular .github/workflows/

  merge-gate-security:
    name: merge gate (security)
    runs-on: ubuntu-latest
    needs:
      [
        gosec,
        zizmor,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate-security
