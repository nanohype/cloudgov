name: security

on:
  # Restricted to main, as every other repo in the org is. With '**' a feature
  # branch push and its pull request both run this workflow, so two check runs
  # of the same name report to one commit — and the merge gate is skipped on the
  # push one, which GitHub scores as Success. A required check whose value
  # depends on which run reported last is not a gate.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Tuesday 06:00 UTC — catches newly published CVEs even when no PRs land.
    - cron: '0 6 * * 2'

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck (known-vuln reachability)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        # Hard gate: exits non-zero when any known vulnerability is reachable
        # from this module's code (symbol-level analysis, not just go.sum).
        # @latest keeps the scanner current against the vuln DB schema.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    name: gosec (static security analysis)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gosec
        # Hard gate: gosec exits non-zero on any finding at medium+ severity.
        # G304 (file inclusion via variable) is excluded wholesale: every hit
        # is an operator-supplied CLI flag path (--from report files, --state
        # tfstate, benchmark/standard files) — reading files the operator
        # names is this CLI's contract, not taint. Everything else either got
        # fixed (G301/G306 permissions) or carries an inline, justified
        # `#nosec` at the site (G101 finding-type labels, G204 fixed per-OS
        # report opener).
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: -severity medium -exclude=G304 -fmt sarif -out gosec.sarif ./...

      - name: upload sarif
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  merge-gate-security:
    name: merge gate (security)
    runs-on: ubuntu-latest
    needs:
      [
        govulncheck,
        gosec,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate-security
