name: security

on:
  # Restricted to main, as every other repo in the org is. With '**' a feature
  # branch push and its pull request both run this workflow, so two check runs
  # of the same name report to one commit — and the merge gate is skipped on the
  # push one, which GitHub scores as Success. A required check whose value
  # depends on which run reported last is not a gate.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Tuesday 06:00 UTC — catches newly published CVEs even when no PRs land.
    - cron: '0 6 * * 2'

# Every job here gates a merge. A check whose verdict depends on the advisory
# database rather than on the tree lives in advisory.yml: the merge gate requires
# every job in this workflow to be one of its dependencies, so a job that must
# not block a merge cannot sit here.
#
# Read-only at the workflow level. Only the job that uploads a SARIF report
# needs security-events: write, and granting it here would hand it to every job
# including the ones that run third-party scanners.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gosec:
    name: gosec (static security analysis)
    runs-on: ubuntu-latest
    # security-events: write is what uploads the SARIF to the Security tab; it
    # grants nothing over the repository's contents, and the read is the
    # checkout.
    permissions:
      contents: read # read the tree gosec analyses
      security-events: write # upload the SARIF report to the Security tab
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gosec
        # Hard gate: gosec exits non-zero on any finding at medium+ severity.
        # G304 (file inclusion via variable) is excluded wholesale: every hit
        # is an operator-supplied CLI path (--from report files, the drift
        # tfstate argument, benchmark/standard files) — reading files the operator
        # names is this CLI's contract, not taint.
        #
        # Every other rule fails the build unless the site itself carries an
        # inline `#nosec` naming the rule and why it does not apply there. That
        # puts the argument beside the code it is about, where a reader changing
        # the code sees it, rather than in a list here that a reader of the code
        # never reaches. `grep -rn '#nosec' --include='*.go' .` answers which
        # sites those are; no other mechanism suppresses a finding, so the grep
        # is the whole of it.
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: -severity medium -exclude=G304 -fmt sarif -out gosec.sarif ./...

      - name: upload sarif
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: gosec.sarif
          category: gosec

  zizmor:
    name: zizmor (workflow supply-chain analysis)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        # Hard gate over this repo's own workflows, which are a dependency
        # surface the Go module manifest does not describe: every third-party
        # action runs with access to the job token and the workspace.
        #
        # --offline is what makes the verdict a function of the commit under
        # test. Without it zizmor resolves action metadata over the network, so
        # the same commit can pass today and fail tomorrow for reasons no diff
        # explains, and a network failure becomes a build failure.
        run: |
          # renovate: datasource=pypi depName=zizmor
          pipx install zizmor==1.30.0
          # The persona selects which audits RUN, and it is a different axis from
          # severity: the excessive-permissions audit is not executed under the
          # default persona at all, so a workflow-level `contents: write` — a
          # grant every job added later inherits, in a diff that reads as adding
          # a job — is reported by nothing. The default reports "No findings"
          # while suppressing that whole class.
          #
          # NO severity filter. `--min-severity` narrows: zizmor already
          # defaults to the most inclusive tier, so naming a level can only
          # remove findings, and a threshold turns a bare "ok" into something
          # indistinguishable from nothing-found. Every workflow here belongs to
          # this repo, so every tier is one this repo can act on, and there is
          # nothing to trade away.
          zizmor --offline --persona=auditor .github/workflows/

  merge-gate-security:
    name: merge gate (security)
    runs-on: ubuntu-latest
    needs:
      [
        gosec,
        zizmor,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@1761cf7500badf44ea21dae6b09810c4641be0e2 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate-security
